<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 580" width="1220" height="580" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">Authentication module boundaries</title>
<desc id="d">Frontend and backend each have a modules/auth boundary whose index.ts is the only entry point. Frontend: App.svelte, AuthModal, the AuthVerify page and feature views import canonicalUserId, signInWithMagicLink, verifyMagicLink, signOut and useSession; App.svelte passes the derived userId to the app/auth data lifecycle, which does not import the module. Internally, application files use infrastructure/authClient.ts, which calls the backend at /api/auth/*. Backend: server.ts, middleware/auth.ts and UsersService import authHttpHandler, resolveAuthenticatedSession, createEmailPasswordUser, toAuthenticatedIdentity and AuthenticatedIdentity. Internal layers are application, domain, config and infrastructure; infrastructure holds the single Better Auth instance, which uses PostgreSQL and Resend; OAuth providers are planned. Boundary tests reject Better Auth or internal auth imports elsewhere.</desc>
