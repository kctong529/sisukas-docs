<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140" width="1000" height="1140" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">Calendar occurrence identity</title>
<desc id="d">For each study event of an active-plan group: excluded events and events without a valid offset interval are not projected. If the event has a non-empty seriesId, the key is the JSON array [series, offering, group, seriesId, startMs]; otherwise a fallback key [fallback, offering, group, startMs, endMs, sorted locationIds, cancelled, excluded, notice or null] is used with a missing_series_identity warning. Keys are compared across the projection; a unique key becomes occurrenceKey and permits occurrence overrides; colliding keys all become null with occurrence_key_collision, leaving group visibility only. Keys are snapshot-scoped: rescheduling changes the key and an old override stays stored but unmatched; it is never moved to another occurrence.</desc>
<style>
