<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">Teaching data flow</title>
<desc id="d">SISU Kori supplies study groups, event series, expanded occurrences and rooms. sisu-wrapper fetches and normalizes them and resolves locations, with in-process caches. The browser's shared study-group runtime retrieves normalized groups and serves them to Calendar projection and other consumers. The Sisukas backend supplies plans, not teaching events. Calendar visibility preferences are in-memory, per plan; their persistence is planned.</desc>
