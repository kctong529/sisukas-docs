<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">Study-group consumer usage</title>
<desc id="d">One shared study-group runtime serves four production consumers. Calendar reads entries through a projection store and applies visibility preferences. Favourites shows StudyGroupsSection, which requests data when a course is expanded. LEGO BlocksGrid requests each course's groups to partition blocks. LEGO schedule analysis ensures full data, builds a payload and sends it to the Sisukas backend for stateless analysis. The authenticated app lifecycle requests the active plan's offerings after sign-in.</desc>
