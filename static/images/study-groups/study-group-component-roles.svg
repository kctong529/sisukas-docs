<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 156 1151 173" role="img" aria-labelledby="t d">
  <title id="t">Study Group Component Roles</title>
  <desc id="d">Compact editable vector diagram extracted from the Sisukas study-group architecture illustrations.</desc>
  <style>
    svg { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #ffffff; }
    .heading { fill: #15253a; font-size: 26px; font-weight: 750; letter-spacing: -.6px; }
    .subheading { fill: #68768a; font-size: 14px; }
    .section { fill: #78869a; font-size: 11px; font-weight: 750; letter-spacing: 1.8px; }
    .divider { stroke: #e5eaf1; stroke-width: 1.5; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #fff; stroke: #cad5e3; stroke-width: 1.6; }
    .card-loader { fill: #f8f6ff; stroke: #c3b6ef; }
    .card-coord { fill: #f3f9fd; stroke: #a9cde6; }
    .c-title { fill: #1b2c40; font-size: 20px; font-weight: 700; }
    .c-q { fill: #2c4058; font-size: 14px; font-weight: 650; }
    .c-detail { fill: #5e6f82; font-size: 13px; }
    .pill { fill: #eef2f7; } .pill-text { fill: #506277; font-size: 10.5px; font-weight: 750; letter-spacing: .5px; }
    .pill-loader { fill: #ece6fd; } .pill-text-loader { fill: #5a45b5; }
    .pill-coord { fill: #dcecf7; } .pill-text-coord { fill: #2a6a99; }
    .pill-warn { fill: #fbecd6; } .pill-text-warn { fill: #94612a; }
    .pill-ready { fill: #dcefe6; } .pill-text-ready { fill: #29775c; }
    .lane-loader { fill: #f8f6ff; } .lane-cache { fill: #f5f7fa; } .lane-coord { fill: #f3f9fd; }
    .lane-title { fill: #1b2c40; font-size: 15px; font-weight: 720; }
    .lane-sub { font-size: 12px; font-weight: 650; }
    .sub-loader { fill: #6b55c9; } .sub-cache { fill: #68768a; } .sub-coord { fill: #2f7fb5; }
    .box { fill: #fff; stroke: #cad5e3; stroke-width: 1.4; }
    .box-loader { stroke: #b9aaea; } .box-coord { stroke: #9cc4e0; }
    .box-net { fill: #21344b; stroke: #21344b; }
    .b-title { fill: #1b2c40; font-size: 13px; font-weight: 680; }
    .b-small { fill: #5e6f82; font-size: 12px; }
    .b-net { fill: #ffffff; } .b-net-small { fill: #c3d1e2; font-size: 12px; }
    .edge { fill: none; stroke: #647b96; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .edge-loader { stroke: #7b66d4; marker-end: url(#arrow-loader); }
    .edge-coord { stroke: #3b8bc2; marker-end: url(#arrow-coord); }
    .edge-dash { fill: none; stroke: #b3a6e6; stroke-width: 1.6; stroke-dasharray: 5 5; }
    .e-text { fill: #51627a; font-size: 11.5px; font-weight: 620; }
    .e-loader { fill: #5a45b5; } .e-coord { fill: #2a6a99; }
    .note { fill: #68768a; font-size: 12px; font-style: italic; }
    .callout { fill: #3d5068; font-size: 13.5px; }
    .bracket { fill: none; stroke: #a5b2c2; stroke-width: 1.5; }
    .b-label { fill: #5e6f82; font-size: 12.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f1724; }
      .heading, .c-title, .lane-title, .b-title { fill: #edf3fb; }
      .subheading, .section, .c-detail, .b-small, .note, .b-label { fill: #a3b0c1; }
      .c-q, .callout { fill: #d3deea; }
      .divider { stroke: #293647; }
      .card, .box { fill: #182436; stroke: #42576d; }
      .card-loader, .lane-loader { fill: #1d1a33; } .card-loader { stroke: #6a5aa8; }
      .card-coord, .lane-coord { fill: #13283a; } .card-coord { stroke: #3f6f93; }
      .lane-cache { fill: #151f2e; }
      .box-loader { stroke: #6a5aa8; } .box-coord { stroke: #3f6f93; }
      .box-net { fill: #dbe5f0; stroke: #dbe5f0; } .b-net { fill: #10203a; } .b-net-small { fill: #3b4f68; }
      .pill { fill: #2a394d; } .pill-text { fill: #c2cedb; }
      .pill-loader { fill: #3a3166; } .pill-text-loader { fill: #d4cbff; }
      .pill-coord { fill: #1f4560; } .pill-text-coord { fill: #b7dcf5; }
      .pill-warn { fill: #4a3a1f; } .pill-text-warn { fill: #f2cf9c; }
      .pill-ready { fill: #204d3e; } .pill-text-ready { fill: #a6e9cc; }
      .sub-loader, .e-loader { fill: #b9acf5; } .sub-coord, .e-coord { fill: #8cc5ea; } .sub-cache, .e-text { fill: #a3b0c1; }
      .edge { stroke: #9cacc0; }
      .bracket { stroke: #52647a; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#647b96" stroke-width="1.5"/></marker>
    <marker id="arrow-loader" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#7b66d4" stroke-width="1.5"/></marker>
    <marker id="arrow-coord" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#3b8bc2" stroke-width="1.5"/></marker>
  </defs>
  <rect class="canvas" width="1240" height="800"/>

  <!-- ═══ Three roles ═══ -->
  <!-- arrows between cards -->
  <path class="edge edge-loader" d="M458 236 H380"/>
  <text class="e-text e-loader" x="419" y="211" text-anchor="middle">reads &amp;</text>
  <text class="e-text e-loader" x="419" y="225" text-anchor="middle">writes</text>
  <path class="edge edge-loader" d="M782 226 H860"/>
  <text class="e-text e-loader" x="821" y="201" text-anchor="middle">asks for</text>
  <text class="e-text e-loader" x="821" y="215" text-anchor="middle">data</text>
  <path class="edge edge-coord" d="M862 262 H784"/>
  <text class="e-text e-coord" x="823" y="283" text-anchor="middle">reports each</text>
  <text class="e-text e-coord" x="823" y="297" text-anchor="middle">outcome</text>

  <g transform="translate(55 166)">
    <rect class="card" width="320" height="150" rx="13"/>
    <text class="c-title" x="20" y="34">Cache</text>
    <rect class="pill" x="200" y="17" width="100" height="22" rx="11"/>
    <text class="pill-text" x="250" y="32" text-anchor="middle">REMEMBERS</text>
    <text class="c-q" x="20" y="66">What data do we have right now?</text>
    <text class="c-detail" x="20" y="94">One entry per offering: groups, status,</text>
    <text class="c-detail" x="20" y="114">error, fetchedAt, refreshing.</text>
    <text class="c-detail" x="20" y="134">Never fetches. Never schedules.</text>
  </g>
  <g transform="translate(460 166)">
    <rect class="card card-loader" width="320" height="150" rx="13"/>
    <text class="c-title" x="20" y="34">Loader</text>
    <rect class="pill pill-loader" x="214" y="17" width="86" height="22" rx="11"/>
    <text class="pill-text pill-text-loader" x="257" y="32" text-anchor="middle">DECIDES</text>
    <text class="c-q" x="20" y="66">Fetch, reuse, or wait for a fetch?</text>
    <text class="c-detail code" x="20" y="94">ensure() · refresh() · clear()</text>
    <text class="c-detail" x="20" y="114">Tracks pending work per offering</text>
    <text class="c-detail" x="20" y="134">and applies outcomes to the cache.</text>
  </g>
  <g transform="translate(865 166)">
    <rect class="card card-coord" width="320" height="150" rx="13"/>
    <text class="c-title" x="20" y="34">Coordinator</text>
    <rect class="pill pill-coord" x="196" y="17" width="104" height="22" rx="11"/>
    <text class="pill-text pill-text-coord" x="248" y="32" text-anchor="middle">SCHEDULES</text>
    <text class="c-q" x="20" y="66">When are transport batches dispatched?</text>
    <text class="c-detail" x="20" y="94">One FIFO queue → batches of ≤ 20</text>
    <text class="c-detail" x="20" y="114">offerings → at most 2 calls at once.</text>
    <text class="c-detail" x="20" y="134">Knows nothing about cached data.</text>
  </g>

  <!-- ═══ Swimlane ═══ -->
  <!-- pending indicator -->
  <!-- arrows -->
  <!-- Loader boxes -->
  <!-- Cache transitions -->
  <!-- Coordinator boxes -->
  <!-- timing brackets -->
  </svg>
