<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 159 1151 245" role="img" aria-labelledby="t d">
  <title id="t">Study Group Request Sharing</title>
  <desc id="d">Compact editable vector diagram extracted from the Sisukas study-group architecture illustrations.</desc>
  <style>
    svg { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #ffffff; }
    .heading { fill: #15253a; font-size: 26px; font-weight: 750; letter-spacing: -.6px; }
    .subheading { fill: #68768a; font-size: 14px; }
    .section { fill: #78869a; font-size: 11px; font-weight: 750; letter-spacing: 1.8px; }
    .divider { stroke: #e5eaf1; stroke-width: 1.5; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #fff; stroke: #cad5e3; stroke-width: 1.4; }
    .box-loader { fill: #f8f6ff; stroke: #c3b6ef; }
    .box-coord { fill: #f3f9fd; stroke: #a9cde6; }
    .box-net { fill: #21344b; stroke: #21344b; }
    .box-ready { fill: #f2faf7; stroke: #98cbb9; }
    .box-stale { fill: #f7f8fa; stroke: #b8c2cf; stroke-dasharray: 6 4; }
    .b-title { fill: #1b2c40; font-size: 14px; font-weight: 700; }
    .b-text { fill: #5e6f82; font-size: 13px; }
    .b-strong { fill: #1b2c40; font-size: 13px; font-weight: 650; }
    .b-net { fill: #ffffff; } .b-net-small { fill: #c3d1e2; font-size: 12.5px; }
    .chip-loader { fill: #ece6fd; } .chip-text-loader { fill: #5a45b5; font-size: 12px; font-weight: 750; }
    .sq1 { fill: #3b8bc2; } .sq2 { fill: #a9cde6; }
    .edge { fill: none; stroke: #647b96; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .edge-loader { stroke: #7b66d4; marker-end: url(#arrow-loader); }
    .edge-coord { stroke: #3b8bc2; marker-end: url(#arrow-coord); }
    .e-text { font-size: 11.5px; font-weight: 650; }
    .e-loader { fill: #5a45b5; } .e-coord { fill: #2a6a99; }
    .cap { font-size: 13px; font-weight: 650; }
    .summary { fill: #1b2c40; font-size: 15px; font-weight: 700; }
    .num { fill: #21344b; } .num-text { fill: #fff; font-size: 12px; font-weight: 800; }
    .pill { fill: #eef2f7; } .pill-text { fill: #506277; font-size: 10.5px; font-weight: 750; letter-spacing: .5px; }
    .pill-warn { fill: #fbecd6; } .pill-text-warn { fill: #94612a; }
    .pill-ready { fill: #dcefe6; } .pill-text-ready { fill: #29775c; }
    .small { fill: #7d8ba0; font-size: 11.5px; font-weight: 650; letter-spacing: .4px; }
    .foot { fill: #f5f7fa; stroke: #e0e7ef; stroke-width: 1.3; }
    .foot-title { fill: #233a53; font-size: 14px; font-weight: 720; }
    .foot-detail { fill: #607187; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f1724; }
      .heading, .b-title, .b-strong, .summary { fill: #edf3fb; }
      .subheading, .section, .b-text, .small { fill: #a3b0c1; }
      .divider { stroke: #293647; }
      .box { fill: #182436; stroke: #42576d; }
      .box-loader { fill: #1d1a33; stroke: #6a5aa8; }
      .box-coord { fill: #13283a; stroke: #3f6f93; }
      .box-ready { fill: #142f2a; stroke: #407e6b; }
      .box-stale { fill: #141c28; stroke: #4a5a6e; }
      .box-net { fill: #dbe5f0; stroke: #dbe5f0; } .b-net { fill: #10203a; } .b-net-small { fill: #3b4f68; }
      .chip-loader { fill: #3a3166; } .chip-text-loader { fill: #d4cbff; }
      .sq2 { fill: #2c5878; }
      .e-loader { fill: #b9acf5; } .e-coord { fill: #8cc5ea; }
      .num { fill: #dbe5f0; } .num-text { fill: #10203a; }
      .pill { fill: #2a394d; } .pill-text { fill: #c2cedb; }
      .pill-warn { fill: #4a3a1f; } .pill-text-warn { fill: #f2cf9c; }
      .pill-ready { fill: #204d3e; } .pill-text-ready { fill: #a6e9cc; }
      .edge { stroke: #9cacc0; }
      .foot { fill: #182436; stroke: #35475c; } .foot-title { fill: #e4edf7; } .foot-detail { fill: #b0bfd0; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#647b96" stroke-width="1.5"/></marker>
    <marker id="arrow-loader" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#7b66d4" stroke-width="1.5"/></marker>
    <marker id="arrow-coord" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#3b8bc2" stroke-width="1.5"/></marker>
  </defs>
  <rect class="canvas" width="1240" height="800"/>
  <!-- ═══ Panel 1: sharing ═══ -->
  <!-- caller → loader -->
  <path class="edge edge-loader" d="M245 191 C285 191 292 252 326 252"/>
  <path class="edge edge-loader" d="M245 247 C280 247 292 252 326 252"/>
  <path class="edge edge-loader" d="M245 303 C285 303 292 252 326 252"/>
  <path class="edge edge-loader" d="M245 375 C285 375 292 310 326 310"/>
  <!-- loader → coordinator -->
  <path class="edge edge-loader" d="M570 282 H641"/>
  <text class="e-text e-loader" x="606" y="270" text-anchor="middle">25 requests</text>
  <!-- coordinator → batches -->
  <path class="edge edge-coord" d="M875 262 C915 262 920 231 956 231"/>
  <path class="edge edge-coord" d="M875 302 C915 302 920 325 956 325"/>

  <g transform="translate(55 168)"><rect class="box" width="190" height="46" rx="9"/>
    <text class="b-strong" x="14" y="20">Course page</text><text class="b-text code" x="14" y="37">ensure(A)</text></g>
  <g transform="translate(55 224)"><rect class="box" width="190" height="46" rx="9"/>
    <text class="b-strong" x="14" y="20">Plan view</text><text class="b-text code" x="14" y="37">ensure(A)</text></g>
  <g transform="translate(55 280)"><rect class="box" width="190" height="46" rx="9"/>
    <text class="b-strong" x="14" y="20">Refresh button</text><text class="b-text code" x="14" y="37">refresh(A)</text></g>
  <g transform="translate(55 352)"><rect class="box" width="190" height="46" rx="9"/>
    <text class="b-strong" x="14" y="20">Plan preload</text><text class="b-text code" x="14" y="37">ensure(B … Y)</text></g>

  <g transform="translate(330 200)"><rect class="box box-loader" width="240" height="160" rx="13"/>
    <text class="b-title" x="18" y="30">Loader</text>
    <rect class="chip-loader" x="18" y="40" width="34" height="24" rx="7"/><text class="chip-text-loader" x="35" y="56" text-anchor="middle">A</text>
    <text class="b-strong" x="62" y="51">1 pending fetch</text>
    <text class="b-text" x="62" y="68">all 3 callers wait on it</text>
    <rect class="chip-loader" x="18" y="98" width="54" height="24" rx="7"/><text class="chip-text-loader" x="45" y="114" text-anchor="middle">B … Y</text>
    <text class="b-strong" x="82" y="109">24 pending fetches</text>
    <text class="b-text" x="82" y="126">one per offering</text>
  </g>

  <g transform="translate(645 200)"><rect class="box box-coord" width="230" height="160" rx="13"/>
    <text class="b-title" x="18" y="30">Coordinator</text>
    <text class="b-text" x="18" y="52">Queue: 25 offerings</text>
    <g transform="translate(18 66)">
      <rect class="sq1" x="0" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="15" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="30" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="45" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="60" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="75" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="90" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="105" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="120" y="0" width="11" height="11" rx="2"/><rect class="sq1" x="135" y="0" width="11" height="11" rx="2"/>
      <rect class="sq1" x="0" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="15" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="30" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="45" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="60" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="75" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="90" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="105" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="120" y="15" width="11" height="11" rx="2"/><rect class="sq1" x="135" y="15" width="11" height="11" rx="2"/>
      <rect class="sq2" x="0" y="30" width="11" height="11" rx="2"/><rect class="sq2" x="15" y="30" width="11" height="11" rx="2"/><rect class="sq2" x="30" y="30" width="11" height="11" rx="2"/><rect class="sq2" x="45" y="30" width="11" height="11" rx="2"/><rect class="sq2" x="60" y="30" width="11" height="11" rx="2"/>
    </g>
    <text class="b-text" x="18" y="132">split into batches of ≤ 20</text>
    <text class="b-text" x="18" y="149">at most 2 calls at once</text>
  </g>

  <g transform="translate(960 196)"><rect class="box box-net" width="225" height="70" rx="11"/>
    <text class="b-title b-net" x="16" y="28">Batch 1 · 20 offerings</text>
    <text class="b-net-small" x="16" y="50">1 network call</text></g>
  <g transform="translate(960 290)"><rect class="box box-net" width="225" height="70" rx="11"/>
    <text class="b-title b-net" x="16" y="28">Batch 2 · 5 offerings</text>
    <text class="b-net-small" x="16" y="50">1 call, in parallel (2nd slot)</text></g>

  <!-- ═══ Panel 2: clear() ═══ -->
  </svg>
